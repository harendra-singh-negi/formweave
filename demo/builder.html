<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>formweave builder</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f8fa; color: #1f2328; }
    main { max-width: 80rem; margin: 0 auto; padding: 1.5rem 1rem; }
    .card { background: #fff; border: 1px solid #d1d9e0; border-radius: 8px; padding: 1.25rem; }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    @media (prefers-color-scheme: dark) { body { background: #010409; color: #e6edf3; } .card { background: #0d1117; border-color: #3d444d; } }
  </style>
  <script type="importmap">
    { "imports": {
      "react": "https://esm.sh/react@19.3.1",
      "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?external=react"
    } }
  </script>
</head>
<body>
  <main class="card">
    <h1>Form builder <small id="saved" style="font-weight:normal;font-size:0.8rem"></small></h1>
    <formweave-builder id="b"></formweave-builder>
  </main>
  <script type="module">
    import '../dist/element.js'
    const b = document.getElementById('b')
    let start
    try { start = JSON.parse(localStorage.getItem('fw-demo-schema')) } catch {}
    b.schema = start ?? {
      version: 1,
      fields: {
        name: { type: 'string', label: 'Full name', required: true },
        employment: { type: 'choice', label: 'Employment', widget: 'radio', options: ['Salaried', 'Self Employed'] },
        business: { type: 'string', label: 'Business name', visible: "employment == 'Self Employed'" },
      },
    }
    b.addEventListener('fw-change', (e) => {
      const { schema, issues } = e.detail
      const saved = document.getElementById('saved')
      if (issues.length) { saved.textContent = `· ${issues.length} issue(s), not saved`; return }
      try { localStorage.setItem('fw-demo-schema', JSON.stringify(schema)) } catch {}
      saved.textContent = '· saved in this browser'
    })
  </script>
</body>
</html>
