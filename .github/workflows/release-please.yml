# Opens a release pull request from the Conventional Commits on main; merging it tags the version, updates the
# changelog and publishes to npm (needs the NPM_TOKEN repository secret, an npm "Automation" token).
name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - if: ${{ steps.release.outputs.release_created }}
        run: npm ci && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
