# Every push to main: the demo built and published to GitHub Pages.
# Optional repository variables (Settings → Secrets and variables → Actions → Variables), kept out of the code so
# only the repository's admins set them:
#   GTM_ID                    Google Tag Manager, like GTM-XXXXXXX (a variable or a secret; set GA4 up inside Tag Manager)
#   GA_MEASUREMENT_ID         Google Analytics 4, like G-XXXXXXXXXX
#   GOOGLE_SITE_VERIFICATION  the content of Search Console's HTML-tag verification
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run demo:build
        env:
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
